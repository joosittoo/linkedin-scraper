name: LinkedIn Scrape and Post

on:
  workflow_dispatch:   # permite lanzarlo manualmente
  schedule:
    - cron: '0 8 * * *'   # cada día a las 08:00 UTC

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run scraper
        env:
          LI_AT: ${{ secrets.LI_AT }}
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
          LD_PROFILE_URL: ${{ secrets.LD_PROFILE_URL }}
          MAX_POSTS: ${{ secrets.MAX_POSTS }}
        run: |
          python scrape_and_post.py
